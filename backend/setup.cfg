[mutmut]
# Mutation scope: FRIE backend application logic only.
# Excluded by construction (not listed here): model .joblib files, model
# JSON metadata, datasets, frontend files, documentation, test files,
# generated files, and virtual environments.
paths_to_mutate=
    app/services/feature_service.py
    app/services/prediction_service.py
    app/core/feature_contract.py
    app/api/routes/prediction.py
    app/api/routes/health.py
    app/schemas/prediction.py
    app/main.py
tests_dir=tests/
runner=D:\frie\Frontend\Frie\backend\.venv\Scripts\python.exe -m pytest -q
